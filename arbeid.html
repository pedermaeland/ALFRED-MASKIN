<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registrer arbeid | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                    <p class="app-title">Logg</p>
                </div>
                <span class="demo-badge">UTKAST</span>
            </div>
        </header>
        <nav class="main-nav" aria-label="Hovedmeny">
            <a href="index.html" aria-current="page">
                <img src="assets/home.svg" alt="" aria-hidden="true">
                <span>Oversikt</span>
            </a>
            <a href="kunder.html">
                <img src="assets/customers.svg" alt="" aria-hidden="true">
                <span>Kunder</span>
            </a>
            <a href="historikk.html">
                <img src="assets/history.svg" alt="" aria-hidden="true">
                <span>Logg</span>
            </a>
            <a href="data.html">
                <img src="assets/export.svg" alt="" aria-hidden="true">
                <span>Data</span>
            </a>
        </nav>
        <main>
            <div class="page-heading">
                <h1>Brøyterunde</h1>
            </div>
            <progress value="1" max="3" aria-label="Eksempel: behandlede stopp"></progress>
            <div class="toolbar">
                <a class="button" href="index.html">Til rundene</a>
                <span>Stopp 2 av 3</span>
            </div>
            <article class="card work-card">
                <span class="status pending">Gjenstår</span>
                <h2>Eksempelkunde B</h2>
                <p class="address">Testbakken 22</p>
                <p class="instructions">Legg snøen på venstre side.</p>
                <!-- Feltene kan prøves, men knappene er deaktivert og ingenting lagres. -->
                <div class="stack">
                    <label>
                        Tjeneste
                        <span class="smooth-field">
                            <select name="service">
                                <option>Brøyting</option>
                                <option>Strøing</option>
                                <option>Annet arbeid</option>
                            </select>
                        </span>
                    </label>
                    <label>
                        Utført dato og klokkeslett
                        <span class="smooth-field">
                            <input type="datetime-local" value="2026-10-30T08:00">
                        </span>
                    </label>
                    <label>
                        Minutter (valgfritt)
                        <span class="smooth-field">
                            <input type="number" min="0" placeholder="F.eks. 15">
                        </span>
                    </label>
                    <label>
                        Notat (valgfritt)
                        <span class="smooth-field">
                            <textarea rows="3" placeholder=""></textarea>
                        </span>
                    </label>
                    <button type="button" disabled class="primary">Lagre og neste</button>
                    <button type="button" disabled>Hopp over</button>
                </div>
            </article>
            <div class="work-navigation">
                <button type="button" disabled>Forrige</button>
                <button type="button" disabled>Neste</button>
            </div>

            <h2 class="section-title">Historikk på adressen</h2>
            <p class="empty">Ingen tidligere arbeid.</p>
        </main>
    </body>
</html>
