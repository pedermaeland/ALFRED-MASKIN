<!doctype html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrer arbeid | ALFRED MASKIN</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/data.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body data-page="work">
    <header class="app-header">
        <div class="header-inner">
            <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
            <div>
                <p class="eyebrow">ALFRED MASKIN</p>
                <p class="app-title">Arbeidslogg</p>
            </div>
            <span class="demo-badge">DEMO</span>
        </div>
    </header>

    <nav class="main-nav" aria-label="Hovedmeny">
        <a href="index.html" aria-current="page">Runder</a>
        <a href="kunder.html">Kunder</a>
        <a href="historikk.html">Arbeidslogg</a>
        <a href="data.html">Data</a>
    </nav>

    <main>
        <p class="prototype-note">Kun fiktive testdata. Lagres i denne nettleseren.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>

        <div id="app">
            <div class="page-heading">
                <h1 id="run-name">Registrer arbeid</h1>
                <p id="run-progress"></p>
            </div>

            <progress id="progress" aria-label="Behandlede stopp"></progress>

            <div class="toolbar">
                <a class="button" href="index.html">Til rundene</a>
                <span id="stop-number"></span>
            </div>

            <article class="card work-card">
                <span id="stop-status" class="status"></span>
                <h2 id="customer-name"></h2>
                <p id="work-address" class="address"></p>
                <p id="instructions" class="instructions"></p>
                <p id="saved-work"></p>

                <form id="work-form" class="stack">
                    <label>
                        Tjeneste
                        <select name="service"></select>
                    </label>
                    <label>
                        Utført dato og klokkeslett
                        <input type="datetime-local" name="workedAt" required>
                    </label>
                    <label>
                        Varighet i minutter (valgfritt)
                        <input type="number" name="duration" min="0" max="10080" step="1" inputmode="numeric">
                    </label>
                    <label>
                        Notat (valgfritt)
                        <textarea name="note" rows="3" maxlength="2000"></textarea>
                    </label>
                    <button type="submit" class="primary">Lagre og neste</button>
                    <button type="button" data-action="skip-stop">Hopp over</button>
                </form>
            </article>

            <div class="work-navigation">
                <a id="previous-stop" class="button">Forrige</a>
                <a id="next-stop" class="button">Neste</a>
            </div>

            <p class="muted">Forrige og Neste bytter bare side. Arbeid registreres først når du trykker «Lagre og neste».</p>
            <h2 class="section-title">Historikk på adressen</h2>
            <div id="address-history"></div>
        </div>

        <noscript>JavaScript må være på for å lese og lagre demodata. Menylenkene fungerer uten.</noscript>
    </main>
</body>
</html>
