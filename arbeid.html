<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Registrer arbeid | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
        <script src="arbeid.js" defer></script>
        <script src="press.js" defer></script>
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
            </div>
        </header>
        <main>
            <a class="back-link" href="index.html" aria-label="Tilbake til oversikt" title="Tilbake til oversikt">
                <img src="assets/back.svg" alt="" aria-hidden="true">
            </a>
            <div class="page-heading">
                <h1 class="text-container">
                    <span class="reveal-text">Brøyterunde</span>
                </h1>
            </div>
            <div class="round-position">
                <span class="round-position-label">Stopp 2 av 3</span>
                <span class="round-progress">
                    <span class="round-segments" aria-hidden="true">
                        <span class="segment-done"></span>
                        <span class="segment-current"></span>
                        <span></span>
                    </span>
                    <span class="row-detail">1 av 3 stopp fullført</span>
                </span>
            </div>
            <article class="card work-card">
                <span class="status pending">Gjenstår</span>
                <h2>Eksempelkunde B</h2>
                <p class="address">Testbakken 22</p>
                <p class="instructions">Legg snøen på venstre side.</p>
                <!-- Prøvevisningen viser hva knappen leser fra skjemaet. -->
                <div class="stack">
                    <label>
                        Tjeneste
                        <span class="smooth-field">
                            <select name="service" id="service">
                                <option>Brøyting</option>
                                <option>Strøing</option>
                                <option>Annet arbeid</option>
                            </select>
                        </span>
                    </label>
                    <label>
                        Utført dato og klokkeslett
                        <span class="smooth-field">
                            <input type="datetime-local" value="2026-10-30T08:00">
                        </span>
                    </label>
                    <details class="optional-work">
                        <summary>
                            <span>Notat og varighet</span>
                            <span class="chevron" aria-hidden="true"></span>
                        </summary>
                        <div class="stack optional-fields">
                            <label>
                                Minutter (valgfritt)
                                <span class="smooth-field">
                                    <input type="number" min="0" placeholder="F.eks. 15">
                                </span>
                            </label>
                            <label>
                                Notat (valgfritt)
                                <span class="smooth-field">
                                    <textarea rows="3" placeholder="" id="note-text"></textarea>
                                </span>
                            </label>
                        </div>
                    </details>
                    <button type="button" id="save-work" class="primary">Se prøvevisning</button>
                    <p id="work-preview" class="work-preview" role="status"></p>
                </div>
            </article>
            <h2 class="section-title">Historikk på adressen</h2>
            <p class="empty">Ingen tidligere jobber.</p>
        </main>
    </body>
</html>
