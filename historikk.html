        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                    <p class="app-title">Logg</p>
                </div>
                <span class="demo-badge">UTKAST</span>
            </div>
        </header>
        <nav class="main-nav" aria-label="Hovedmeny">
            <a href="index.html">
                <img src="assets/home.svg" alt="" aria-hidden="true">
                <span>Oversikt</span>
            </a>
            <a href="kunder.html">
                <img src="assets/customers.svg" alt="" aria-hidden="true">
                <span>Kunder</span>
            </a>
            <a href="historikk.html" aria-current="page">
                <img src="assets/history.svg" alt="" aria-hidden="true">

            <a href="data.html">
                <img src="assets/export.svg" alt="" aria-hidden="true">
                <span>Data</span>
            </a>
        </nav>
        <main>
            <div class="page-heading">
                <h1>Logg</h1>
            </div>
            <div class="filters">
                <label>
                    Kunde
                    <span class="smooth-field">
                        <select disabled>
                            <option>Alle kunder</option>
                        </select>
                    </span>
                </label>
                <label>
                    Dato
                    <span class="smooth-field">
                        <input type="date" disabled>
                    </span>
                </label>
                <label>
                    Tjeneste
                    <span class="smooth-field">
                        <select disabled>
                            <option>Alle tjenester</option>
                        </select>
                    </span>
                </label>
            </div>
            <div class="stack">
                <!-- Fast eksempel. Endre navn, tjeneste, dato og notat her. -->
                <article class="card">
                    <div class="row">
                        <h3>Eksempelkunde A</h3>
                        <span class="status completed">Brøyting</span>
                    </div>
                    <p>Eksempelvegen 10</p>
                    <p>
                        <strong>30.10.2026, 07:30</strong>
                        · 15 min
                    </p>
                    <p class="instructions">Brøytet foran garasjen.</p>

                </article>
            </div>
