<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Logg | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
        <script src="press.js" defer></script>
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
            </div>
        </header>
        <main>
            <a class="back-link" href="index.html" aria-label="Tilbake til oversikt" title="Tilbake til oversikt">
                <img src="assets/back.svg" alt="" aria-hidden="true">
            </a>
            <div class="page-heading">
                <h1 class="text-container">
                    <span class="reveal-text">Logg</span>
                </h1>
            </div>
            <div class="filters">
                <label>
                    Kunde
                    <span class="smooth-field">
                        <select disabled>
                            <option>Alle kunder</option>
                        </select>
                    </span>
                </label>
                <label>
                    Dato
                    <span class="smooth-field">
                        <input type="date" disabled>
                    </span>
                </label>
                <label>
                    Tjeneste
                    <span class="smooth-field">
                        <select disabled>
                            <option>Alle tjenester</option>
                        </select>
                    </span>
                </label>
            </div>
            <div class="stack">
                <!-- Fast eksempel. Endre navn, tjeneste, dato og notat her. -->
                <article class="card">
                    <div class="row">
                        <h3>Eksempelkunde A</h3>
                        <span class="status completed">Brøyting</span>
                    </div>
                    <p>Eksempelvegen 10</p>
                    <p>
                        <strong>30.10.2026, 07:30</strong>
                        · 15 min
                    </p>
                    <p class="instructions">Brøytet foran garasjen.</p>

                </article>
            </div>
        </main>
    </body>
</html>
