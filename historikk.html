<!doctype html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arbeidslogg | ALFRED MASKIN</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/data.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body data-page="history">
    <header class="app-header">
        <div class="header-inner">
            <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
            <div>
                <p class="eyebrow">ALFRED MASKIN</p>
                <p class="app-title">Arbeidslogg</p>
            </div>
            <span class="demo-badge">DEMO</span>
        </div>
    </header>

    <nav class="main-nav" aria-label="Hovedmeny">
        <a href="index.html">Runder</a>
        <a href="kunder.html">Kunder</a>
        <a href="historikk.html" aria-current="page">Arbeidslogg</a>
        <a href="data.html">Data</a>
    </nav>

    <main>
        <p class="prototype-note">Kun fiktive testdata. Lagres i denne nettleseren.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>

        <div id="app">
            <div class="page-heading">
                <h1>Arbeidslogg</h1>
                <p>Hver registrering bevares, også når en ny kjøring starter.</p>
            </div>

            <div class="filters">
                <label for="history-customer">
                    Kunde
                    <select id="history-customer">
                        <option value="">Alle kunder</option>
                    </select>
                </label>
                <label>
                    Dato
                    <input type="date" id="history-date">
                </label>
                <label for="history-service">
                    Tjeneste
                    <select id="history-service">
                        <option value="">Alle tjenester</option>
                        <option>Brøyting</option>
                        <option>Strøing</option>
                        <option>Annet arbeid</option>
                    </select>
                </label>
            </div>

            <div id="history-results"></div>
        </div>

        <noscript>JavaScript må være på for å lese og lagre demodata. Menylenkene fungerer uten.</noscript>
    </main>
</body>
</html>
