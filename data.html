<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Data og sikkerhetskopi | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
        <script src="press.js" defer></script>
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
            </div>
        </header>
        <main>
            <a class="back-link" href="index.html" aria-label="Tilbake til oversikt" title="Tilbake til oversikt">
                <img src="assets/back.svg" alt="" aria-hidden="true">
            </a>
            <div class="page-heading">
                <h1 class="text-container">
                    <span class="reveal-text">Data</span>
                </h1>
            </div>
            <div class="stack">
                <p class="muted">Lagring og eksport er ikke aktivert i utkastet.</p>
                <section class="card">
                    <h2>Sikkerhetskopi</h2>

                    <button type="button" disabled class="primary">Last ned sikkerhetskopi</button>
                    <div class="stack restore-form">
                        <label>
                            Velg sikkerhetskopi
                            <span class="smooth-field">
                                <input type="file" disabled>
                            </span>
                        </label>
                        <button type="button" disabled>Gjenopprett</button>
                    </div>
                </section>
                <section class="card">
                    <h2>Regneark</h2>

                    <button type="button" disabled>Last ned CSV</button>
                </section>
            </div>
        </main>
    </body>
</html>
