<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Dagens plan | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
        <script src="press.js" defer></script>
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
            </div>
        </header>
        <main>
            <a class="back-link" href="index.html" aria-label="Tilbake til oversikt" title="Tilbake til oversikt">
                <img src="assets/back.svg" alt="" aria-hidden="true">
            </a>
            <div class="page-heading">
                <h1 class="text-container">
                    <span class="reveal-text">Dagens plan</span>
                </h1>
                <p><time datetime="2026-10-30">30. oktober</time></p>
            </div>
            <!-- Et fiktivt jobbkort. Ingen registrering eller lagring er aktivert. -->
            <article id="jobb-a" class="card stack">
                <div class="row">
                    <span class="eyebrow">Strøing</span>
                    <span class="status">Planlagt</span>
                </div>
                <div>
                    <h2>Eksempelkunde A</h2>
                    <p class="muted">Eksempelvegen 10</p>
                </div>
                <p class="instructions">Strø foran garasjen og ved inngangen.</p>
                <button type="button" class="primary" disabled>Start jobb</button>
            </article>
        </main>
    </body>
</html>
