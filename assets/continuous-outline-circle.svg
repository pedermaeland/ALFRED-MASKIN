<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 320 160"
>
    <!--
        Calibrated for 16px corners.
        Nominal edge widths are 0.5 CSS px at the top, 0.2 at the sides and 0.3 at the bottom.
        The outer curve is crisp. Six translucent outlines create a
        soft inner edge even when the browser would round off
        small blur values.
        The GLASS EDGES section in style.css sets the color.
    -->
    <defs>
        <path
            id="outer"
            d="
                M 48 0
                L 272 0
                A 48 48 0 0 1 320 48
                L 320 112
                A 48 48 0 0 1 272 160
                L 48 160
                A 48 48 0 0 1 0 112
                L 0 48
                A 48 48 0 0 1 48 0
                Z
            "
        />
        <mask
            id="edge"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="320"
            height="160"
            style="mask-type: luminance;"
        >
            <use href="#outer" fill="white" />

            <!-- Black gradually masks the inside. White preserves the edge. -->
            <path
                fill="black"
                opacity="0.166666667"
                d="
                M 48.000000 1.078125
                L 272.000000 1.078125
                A 47.850000 46.921875 0.000000 0 1 319.850000 48.000000
                L 319.850000 112.000000
                A 47.850000 47.505000 0.000000 0 1 272.000000 159.505000
                L 48.000000 159.505000
                A 47.850000 47.505000 0.000000 0 1 0.150000 112.000000
                L 0.150000 48.000000
                A 47.850000 46.921875 0.000000 0 1 48.000000 1.078125
                Z
                "
            />
            <path
                fill="black"
                opacity="0.200000000"
                d="
                M 48.000000 1.246875
                L 272.000000 1.246875
                A 47.670000 46.753125 0.000000 0 1 319.670000 48.000000
                L 319.670000 112.000000
                A 47.670000 47.343000 0.000000 0 1 272.000000 159.343000
                L 48.000000 159.343000
                A 47.670000 47.343000 0.000000 0 1 0.330000 112.000000
                L 0.330000 48.000000
                A 47.670000 46.753125 0.000000 0 1 48.000000 1.246875
                Z
                "
            />
            <path
                fill="black"
                opacity="0.250000000"
                d="
                M 48.000000 1.415625
                L 272.000000 1.415625
                A 47.490000 46.584375 0.000000 0 1 319.490000 48.000000
                L 319.490000 112.000000
                A 47.490000 47.181000 0.000000 0 1 272.000000 159.181000
                L 48.000000 159.181000
                A 47.490000 47.181000 0.000000 0 1 0.510000 112.000000
                L 0.510000 48.000000
                A 47.490000 46.584375 0.000000 0 1 48.000000 1.415625
                Z
                "
            />
            <path
                fill="black"
                opacity="0.333333333"
                d="
                M 48.000000 1.584375
                L 272.000000 1.584375
                A 47.310000 46.415625 0.000000 0 1 319.310000 48.000000
                L 319.310000 112.000000
                A 47.310000 47.019000 0.000000 0 1 272.000000 159.019000
                L 48.000000 159.019000
                A 47.310000 47.019000 0.000000 0 1 0.690000 112.000000
                L 0.690000 48.000000
                A 47.310000 46.415625 0.000000 0 1 48.000000 1.584375
                Z
                "
            />
            <path
                fill="black"
                opacity="0.500000000"
                d="
                M 48.000000 1.753125
                L 272.000000 1.753125
                A 47.130000 46.246875 0.000000 0 1 319.130000 48.000000
                L 319.130000 112.000000
                A 47.130000 46.857000 0.000000 0 1 272.000000 158.857000
                L 48.000000 158.857000
                A 47.130000 46.857000 0.000000 0 1 0.870000 112.000000
                L 0.870000 48.000000
                A 47.130000 46.246875 0.000000 0 1 48.000000 1.753125
                Z
                "
            />
            <path
                fill="black"
                opacity="1.000000000"
                d="
                M 48.000000 1.921875
                L 272.000000 1.921875
                A 46.950000 46.078125 0.000000 0 1 318.950000 48.000000
                L 318.950000 112.000000
                A 46.950000 46.695000 0.000000 0 1 272.000000 158.695000
                L 48.000000 158.695000
                A 46.950000 46.695000 0.000000 0 1 1.050000 112.000000
                L 1.050000 48.000000
                A 46.950000 46.078125 0.000000 0 1 48.000000 1.921875
                Z
                "
            />
        </mask>
    </defs>

    <!-- The outer curve keeps the outside edge sharp. -->
    <use href="#outer" fill="black" mask="url(#edge)" />
</svg>
