    <!--
        Calibrated for 16px corners.
        Nominal edge widths are 0.5 CSS px at the top, 0.2 at the sides and 0.3 at the bottom.
        The outer curve is crisp. Six translucent outlines create a
        soft inner edge even when the browser would round off
        small blur values.
        The GLASS EDGES section in style.css sets the color.
    -->
