<svg
    xmlns="http://www.w3.org/2000/svg"
    width="320"
    height="160"
    viewBox="0 0 320 160"
    role="img"
    aria-labelledby="shape-title shape-description"
>
    <title id="shape-title">Kontinuerlige hjørner</title>
    <desc id="shape-description">
        Et rektangel med G2-kontinuerlige hjørner. Kurven går gradvis
        fra rette kanter til avrundede hjørner. Dette er en egen
        tilnærming til uttrykket, ikke en eksakt kopi av Apples geometri.
    </desc>

    <!--
        Change fill to set the color.
        The background is transparent.

        Each corner uses two C commands (cubic Bézier curves).
        The L commands draw straight edges between corners.
        Curvature is zero where the curve meets a straight edge, and
        matches on both sides of the join between the curves (G2).

        This shape is 320 x 160. Scale it proportionally to
        preserve the corners. The corner radius stays fixed relative
        to the shape's dimensions.
    -->
    <path
        id="continuous-rectangle"
        fill="#202020"
        d="
            M 48 0
            L 272 0
            C 286.4 0 300.8 0 310.4 9.6
            C 320 19.2 320 33.6 320 48

            L 320 112
            C 320 126.4 320 140.8 310.4 150.4
            C 300.8 160 286.4 160 272 160

            L 48 160
            C 33.6 160 19.2 160 9.6 150.4
            C 0 140.8 0 126.4 0 112

            L 0 48
            C 0 33.6 0 19.2 9.6 9.6
            C 19.2 0 33.6 0 48 0
            Z
        "
    />
</svg>
