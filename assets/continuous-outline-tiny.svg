<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 320 160"
>
    <!--
        Calibrated for 8px corners.
        Nominal edge widths are 0.5 CSS px at the top, 0.2 at the sides and 0.3 at the bottom.
        The outer curve is crisp. Six translucent outlines create a
        soft inner edge even when the browser would round off
        small blur values.
        The GLASS EDGES section in style.css sets the color.
    -->
    <defs>
        <path
            id="outer"
            d="
                M 48 0
                L 272 0
                C 286.4 0 300.8 0 310.4 9.6
                C 320 19.2 320 33.6 320 48
                L 320 112
                C 320 126.4 320 140.8 310.4 150.4
                C 300.8 160 286.4 160 272 160
                L 48 160
                C 33.6 160 19.2 160 9.6 150.4
                C 0 140.8 0 126.4 0 112
                L 0 48
                C 0 33.6 0 19.2 9.6 9.6
                C 19.2 0 33.6 0 48 0
                Z
            "
        />
        <mask
            id="edge"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="320"
            height="160"
            style="mask-type: luminance;"
        >
            <use href="#outer" fill="white" />

            <!-- Black gradually masks the inside. White preserves the edge. -->
            <path
                fill="black"
                opacity="0.166666667"
                d="
                M 48.000000 2.156250
                L 272.000000 2.156250
                C 286.310000 2.156250 300.620000 2.156250 310.160000 11.325000
