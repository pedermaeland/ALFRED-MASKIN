<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 320 160"
>
    <!--
        Calibrated for 24px corners.
        Nominal edge widths are 0.5 CSS px at the top, 0.2 at the sides and 0.3 at the bottom.
        The outer curve is crisp. Six translucent outlines create a
        soft inner edge even when the browser would round off
        small blur values.
        The GLASS EDGES section in style.css sets the color.
    -->
    <defs>
        <path
            id="outer"
            d="
                M 48 0
                L 272 0
                A 48 48 0 0 1 320 48
                L 320 112
                A 48 48 0 0 1 272 160
                L 48 160
                A 48 48 0 0 1 0 112
                L 0 48
                A 48 48 0 0 1 48 0
                Z
            "
        />
        <mask
            id="edge"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="320"
            height="160"
            style="mask-type: luminance;"
        >
            <use href="#outer" fill="white" />

            <!-- Black gradually masks the inside. White preserves the edge. -->
            <path
                fill="black"
                opacity="0.166666667"
                d="
                M 48.000000 0.718750
                L 272.000000 0.718750
                A 47.900000 47.281250 0.000000 0 1 319.900000 48.000000
                L 319.900000 112.000000
                A 47.900000 47.670000 0.000000 0 1 272.000000 159.670000
                L 48.000000 159.670000
                A 47.900000 47.670000 0.000000 0 1 0.100000 112.000000
                L 0.100000 48.000000
                A 47.900000 47.281250 0.000000 0 1 48.000000 0.718750
                Z
                "
            />
            <path
                fill="black"
                opacity="0.200000000"
                d="
                M 48.000000 0.831250
                L 272.000000 0.831250
                A 47.780000 47.168750 0.000000 0 1 319.780000 48.000000
                L 319.780000 112.000000
                A 47.780000 47.562000 0.000000 0 1 272.000000 159.562000
                L 48.000000 159.562000
                A 47.780000 47.562000 0.000000 0 1 0.220000 112.000000
                L 0.220000 48.000000
                A 47.780000 47.168750 0.000000 0 1 48.000000 0.831250
                Z
                "
            />
            <path
                fill="black"
                opacity="0.250000000"
                d="
                M 48.000000 0.943750
                L 272.000000 0.943750
                A 47.660000 47.056250 0.000000 0 1 319.660000 48.000000
                L 319.660000 112.000000
                A 47.660000 47.454000 0.000000 0 1 272.000000 159.454000
                L 48.000000 159.454000
                A 47.660000 47.454000 0.000000 0 1 0.340000 112.000000
                L 0.340000 48.000000
                A 47.660000 47.056250 0.000000 0 1 48.000000 0.943750
                Z
                "
            />
            <path
                fill="black"
                opacity="0.333333333"
                d="
                M 48.000000 1.056250
                L 272.000000 1.056250
                A 47.540000 46.943750 0.000000 0 1 319.540000 48.000000
                L 319.540000 112.000000
                A 47.540000 47.346000 0.000000 0 1 272.000000 159.346000
                L 48.000000 159.346000
                A 47.540000 47.346000 0.000000 0 1 0.460000 112.000000
                L 0.460000 48.000000
                A 47.540000 46.943750 0.000000 0 1 48.000000 1.056250
                Z
                "
            />
            <path
                fill="black"
                opacity="0.500000000"
                d="
                M 48.000000 1.168750
                L 272.000000 1.168750
                A 47.420000 46.831250 0.000000 0 1 319.420000 48.000000
                L 319.420000 112.000000
                A 47.420000 47.238000 0.000000 0 1 272.000000 159.238000
                L 48.000000 159.238000
                A 47.420000 47.238000 0.000000 0 1 0.580000 112.000000
                L 0.580000 48.000000
                A 47.420000 46.831250 0.000000 0 1 48.000000 1.168750
                Z
                "
            />
            <path
                fill="black"
                opacity="1.000000000"
                d="
                M 48.000000 1.281250
                L 272.000000 1.281250
                A 47.300000 46.718750 0.000000 0 1 319.300000 48.000000
                L 319.300000 112.000000
                A 47.300000 47.130000 0.000000 0 1 272.000000 159.130000
                L 48.000000 159.130000
                A 47.300000 47.130000 0.000000 0 1 0.700000 112.000000
                L 0.700000 48.000000
                A 47.300000 46.718750 0.000000 0 1 48.000000 1.281250
                Z
                "
            />
        </mask>
    </defs>

    <!-- The outer curve keeps the outside edge sharp. -->
    <use href="#outer" fill="black" mask="url(#edge)" />
</svg>
