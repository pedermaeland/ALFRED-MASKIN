<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kundedetaljer | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                    <p class="app-title">Logg</p>
                </div>
                <span class="demo-badge">UTKAST</span>
            </div>
        </header>
        <nav class="main-nav" aria-label="Hovedmeny">
            <a href="index.html">
                <img src="assets/home.svg" alt="" aria-hidden="true">
                <span>Oversikt</span>
            </a>
            <a href="kunder.html" aria-current="page">
                <img src="assets/customers.svg" alt="" aria-hidden="true">
                <span>Kunder</span>
            </a>
            <a href="historikk.html">
                <img src="assets/history.svg" alt="" aria-hidden="true">
                <span>Logg</span>
            </a>
            <a href="data.html">
                <img src="assets/export.svg" alt="" aria-hidden="true">
                <span>Data</span>
            </a>
        </nav>
        <main>
            <div class="page-heading">
                <h1>Kundedetaljer</h1>
            </div>
            <!-- Vanlige HTML-felt. Endre value for å endre eksempelteksten. -->
            <div class="card stack">
                <label>
                    Navn
                    <span class="smooth-field">
                        <input name="name" value="Eksempelkunde A" maxlength="120">
                    </span>
                </label>
                <div class="form-grid">
                    <label>
                        Telefon (valgfritt)
                        <span class="smooth-field">
                            <input name="phone" type="tel" maxlength="50">
                        </span>
                    </label>
                    <label>
                        E-post (valgfritt)
                        <span class="smooth-field">
                            <input name="email" type="email" maxlength="200">
                        </span>
                    </label>
                </div>
                <label>
                    Kundenotat (valgfritt)
                    <span class="smooth-field">
                        <textarea name="notes" rows="2"></textarea>
                    </span>
                </label>
                <!-- Kopier hele fieldset-blokken hvis du vil vise flere adresser. -->
                <fieldset class="address-fields">
                    <legend>Arbeidsadresse</legend>
                    <label>
                        Adresse
                        <span class="smooth-field">
                            <input name="addressLabel" value="Eksempelvegen 10" required maxlength="200">
                        </span>
                    </label>
                    <label>
                        Instruksjoner
                        <span class="smooth-field">
                            <textarea name="instructions" rows="2" maxlength="2000"></textarea>
                        </span>
                    </label>
                    <div class="service-options">
                        <label class="checkbox">
                            <input type="checkbox" name="services" value="Brøyting" checked>
                            Brøyting
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" name="services" value="Strøing">
                            Strøing
                        </label>
                        <label class="checkbox">
                            <input type="checkbox" name="services" value="Annet arbeid">
                            Annet arbeid
                        </label>
                    </div>
                </fieldset>
                <button type="button" disabled>Legg til en adresse</button>
                <div class="actions">
                    <button type="button" disabled class="primary">Lagre kunde</button>
                    <a class="button" href="kunder.html">Til kundene</a>
                </div>
            </div>
        </main>
    </body>
</html>
