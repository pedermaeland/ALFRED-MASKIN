<!doctype html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rediger runde | ALFRED MASKIN</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/data.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body data-page="round-edit">
    <header class="app-header">
        <div class="header-inner">
            <img class="brand-logo" src="assets/Nettside%20for%20ALFRED%20MASKIN/3.png" alt="ALFRED MASKIN">
            <div>
                <p class="eyebrow">ALFRED MASKIN</p>
                <p class="app-title">Arbeidslogg</p>
            </div>
            <span class="demo-badge">DEMO</span>
        </div>
    </header>

    <nav class="main-nav" aria-label="Hovedmeny">
        <a href="index.html" aria-current="page">Runder</a>
        <a href="kunder.html">Kunder</a>
        <a href="historikk.html">Arbeidslogg</a>
        <a href="data.html">Data</a>
    </nav>

    <main>
        <p class="prototype-note">Kun fiktive testdata. Lagres i denne nettleseren.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>

        <div id="app">
            <div class="page-heading">
                <h1>Rundedetaljer</h1>
            </div>

            <form id="round-form" class="card stack">
                <label>
                    Navn på runden
                    <input name="name" required maxlength="120">
                </label>

                <h2>Adresser i kjørerekkefølge</h2>
                <ol id="round-stops" class="stop-list"></ol>

                <label>
                    Legg til arbeidsadresse
                    <select name="address">
                        <option value="">Velg adresse</option>
                    </select>
                </label>

                <button type="button" data-action="add-stop">Legg til adresse</button>

                <div class="actions">
                    <button type="submit" class="primary">Lagre runde</button>
                    <a class="button" href="index.html">Avbryt</a>
                </div>
            </form>
        </div>

        <noscript>JavaScript må være på for å lese og lagre demodata. Menylenkene fungerer uten.</noscript>
    </main>
</body>
</html>
