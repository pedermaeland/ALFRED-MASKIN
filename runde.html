<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Rediger runde | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
            </div>
        </header>
        <main>
            <a class="back-link" href="index.html#runder" aria-label="Tilbake til mine runder" title="Tilbake til mine runder">
                <img src="assets/back.svg" alt="" aria-hidden="true">
            </a>
            <div class="page-heading">
                <h1>Rundedetaljer</h1>
            </div>
            <div class="card stack">
                <label>
                    Navn på runden
                    <span class="smooth-field">
                        <input name="name" value="Brøyterunde" maxlength="120">
                    </span>
                </label>
                <h2>Kjørerekkefølge</h2>
                <ol class="stop-list">
                    <li class="card round-stop">
                        <section class="heading">
                            <strong>Eksempelkunde A</strong>
                            <p>Eksempelvegen 10</p>
                        </section>
                        <div class="actions">
                            <button type="button" disabled aria-label="Flytt opp">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 20V4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Flytt ned">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4V20M12 20L18 14M12 20L6 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Fjern">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 3H15M3 6H21M19 6L18.2987 16.5193C18.1935 18.0975 18.1409 18.8867 17.8 19.485C17.4999 20.0118 17.0472 20.4353 16.5017 20.6997C15.882 21 15.0911 21 13.5093 21H10.4907C8.90891 21 8.11803 21 7.49834 20.6997C6.95276 20.4353 6.50009 20.0118 6.19998 19.485C5.85911 18.8867 5.8065 18.0975 5.70129 16.5193L5 6M10 10.5V15.5M14 10.5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </li>
                    <li class="card round-stop">
                        <section class="heading">
                            <strong>Eksempelkunde B</strong>
                            <p>Testbakken 22</p>
                        </section>
                        <div class="actions">
                            <button type="button" disabled aria-label="Flytt opp">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 20V4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Flytt ned">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4V20M12 20L18 14M12 20L6 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Fjern">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 3H15M3 6H21M19 6L18.2987 16.5193C18.1935 18.0975 18.1409 18.8867 17.8 19.485C17.4999 20.0118 17.0472 20.4353 16.5017 20.6997C15.882 21 15.0911 21 13.5093 21H10.4907C8.90891 21 8.11803 21 7.49834 20.6997C6.95276 20.4353 6.50009 20.0118 6.19998 19.485C5.85911 18.8867 5.8065 18.0975 5.70129 16.5193L5 6M10 10.5V15.5M14 10.5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </li>
                    <li class="card round-stop">
                        <section class="heading">
                            <strong>Eksempelkunde C</strong>
                            <p>Demotunet 3</p>
                        </section>
                        <div class="actions">
                            <button type="button" disabled aria-label="Flytt opp">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 20V4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Flytt ned">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4V20M12 20L18 14M12 20L6 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <button type="button" disabled aria-label="Fjern">
                                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 3H15M3 6H21M19 6L18.2987 16.5193C18.1935 18.0975 18.1409 18.8867 17.8 19.485C17.4999 20.0118 17.0472 20.4353 16.5017 20.6997C15.882 21 15.0911 21 13.5093 21H10.4907C8.90891 21 8.11803 21 7.49834 20.6997C6.95276 20.4353 6.50009 20.0118 6.19998 19.485C5.85911 18.8867 5.8065 18.0975 5.70129 16.5193L5 6M10 10.5V15.5M14 10.5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </li>
                </ol>
                <label>
                    Legg til arbeidsadresse
                    <span class="smooth-field">
                        <select disabled>
                            <option>Velg adresse</option>
                        </select>
                    </span>
                </label>
                <button type="button" disabled>Legg til adresse</button>
                <div class="actions">
                    <button type="button" disabled class="primary">Lagre runde</button>
                    <a class="button" href="index.html">Til rundene</a>
                </div>
            </div>
        </main>
    </body>
</html>
