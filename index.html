<!doctype html>
<html lang="nb">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111415">
        <title>Arbeidsoversikt | ALFRED MASKIN</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="continuous-corners.css">
        <script src="press.js" defer></script>
    </head>
    <body>
        <header class="app-header">
            <div class="header-inner">
                <div>
                    <p class="eyebrow">ALFRED MASKIN</p>
                </div>
                <span class="demo-badge" title="Kun fiktive testdata">DEMO</span>
                <a class="header-link" href="data.html">Data</a>
            </div>
        </header>
        <main class="home-main">
            <div class="home-heading">
                <h1 class="text-container">
                    <span class="reveal-text">Oversikt</span>
                </h1>
            </div>

            <!-- FORTSETT: En tidligere startet kjøring, uten at det lagres noe i utkastet. -->
            <a class="card continue-round" href="arbeid.html">
                <span class="list-icon icon-amber" aria-hidden="true">
                    <img src="assets/rounds.svg" alt="">
                </span>
                <span class="list-text">
                    <span class="row-detail">Pågående runde</span>
                    <span class="row-title">Fortsett brøyterunden</span>
                    <span class="row-detail">Neste stopp · Testbakken 22</span>
                    <span class="round-progress">
                        <span class="round-segments" aria-hidden="true">
                            <span class="segment-done"></span>
                            <span class="segment-current"></span>
                            <span></span>
                        </span>
                        <span class="row-detail">1 av 3 stopp fullført</span>
                    </span>
                </span>
                <span class="chevron" aria-hidden="true"></span>
            </a>

            <!-- OVERSIKT: Tallene er faste eksempler. Hver flis er en vanlig lenke. -->
            <nav class="overview-grid" aria-label="Arbeidsoversikt">
                <a class="overview-tile tile-blue" href="plan.html">
                    <img class="tile-icon" src="assets/calendar.svg" alt="" aria-hidden="true">
                    <span class="tile-count">1</span>
                    <span class="tile-label">I dag</span>
                </a>
                <a class="overview-tile tile-red" href="runde.html">
                    <img class="tile-icon" src="assets/rounds.svg" alt="" aria-hidden="true">
                    <span class="tile-count">1</span>
                    <span class="tile-label">Runder</span>
                </a>
                <a class="overview-tile tile-grey" href="kunder.html">
                    <img class="tile-icon" src="assets/customers.svg" alt="" aria-hidden="true">
                    <span class="tile-count">3</span>
                    <span class="tile-label">Kunder</span>
                </a>
                <a class="overview-tile tile-slate" href="historikk.html">
                    <img class="tile-icon" src="assets/history.svg" alt="" aria-hidden="true">
                    <span class="tile-count">1</span>
                    <span class="tile-label">Logg</span>
                </a>
            </nav>

            <!-- RUNDER: Kopier en hel li-blokk for å vise en ekstra runde. -->
            <section id="runder" class="home-section" aria-labelledby="rounds-heading">
                <h2 id="rounds-heading">Mine runder</h2>
                <ul class="card grouped-list">
                    <li>
                        <a class="list-link" href="runde.html">
                            <span class="list-icon icon-red" aria-hidden="true">
                                <img src="assets/rounds.svg" alt="">
                            </span>
                            <span class="list-text">
                                <span class="row-title">Brøyterunde</span>
                                <span class="row-detail">3 adresser</span>
                            </span>
                            <span class="chevron" aria-hidden="true"></span>
                        </a>
                    </li>
                </ul>
            </section>

            <!-- DAGENS PLAN: Et fast eksempel med samme dato som plan.html. -->
            <section class="home-section" aria-labelledby="today-heading">
                <div class="section-heading">
                    <h2 id="today-heading">Dagens plan</h2>
                    <time datetime="2026-10-30">30. oktober</time>
                </div>
                <ul class="card grouped-list">
                    <li>
                        <a class="list-link" href="plan.html#jobb-a">
                            <span class="list-icon icon-blue" aria-hidden="true">
                                <img src="assets/calendar.svg" alt="">
                            </span>
                            <span class="list-text">
                                <span class="row-title">Eksempelkunde A</span>
                                <span class="row-detail">Strøing · Eksempelvegen 10</span>
                            </span>
                            <span class="chevron" aria-hidden="true"></span>
                        </a>
                    </li>
                </ul>
            </section>
        </main>

        <!-- FAST PLUSSKNAPP: En vanlig lenke til rundeutkastet. -->
        <a class="floating-add" href="runde.html" aria-label="Ny runde" title="Ny runde">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </a>
    </body>
</html>
